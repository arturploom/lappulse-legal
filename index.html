<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LapPulse — Legal</title>
  <style>
    :root { --bg: #0D0D0F; --text: #E0E0FF; --dim: #6E6E90; --accent: #2BFAAB; --border: #2A2A4C; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .container { text-align: center; }
    h1 { color: var(--accent); font-size: 32px; margin-bottom: 8px; }
    p { color: var(--dim); margin-bottom: 32px; }
    .links { display: flex; flex-direction: column; gap: 16px; }
    a { color: var(--accent); font-size: 18px; text-decoration: none; padding: 12px 32px; border: 1px solid var(--border); border-radius: 8px; transition: border-color 0.2s; }
    a:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <h1>LapPulse</h1>
    <p>Strava for kart drivers</p>
    <div class="links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
    </div>
  </div>
</body>
</html>
